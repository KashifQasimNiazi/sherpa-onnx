name: build-urdu-wasm-tts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install emsdk
        uses: mymindstorm/setup-emsdk@v14

      - name: View emsdk version
        shell: bash
        run: |
          emcc -v
          emcc --check

      - name: Download Urdu MMS model
        shell: bash
        run: |
          cd wasm/tts/assets
          BASE=https://huggingface.co/willwade/mms-tts-multilingual-models-onnx/resolve/main/urd-script_arabic
          wget -q "$BASE/model.onnx" -O model.onnx
          wget -q "$BASE/tokens.txt" -O tokens.txt
          ls -lh

      - name: Build sherpa-onnx for WebAssembly
        shell: bash
        run: |
          ./build-wasm-simd-tts.sh

      - name: Upload wasm files
        uses: actions/upload-artifact@v4
        with:
          name: urdu-tts-wasm
          path: build-wasm-simd-tts/install/bin/wasm/tts/
